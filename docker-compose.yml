version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wukway_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wukway_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wukway_pass}
      POSTGRES_DB: ${POSTGRES_DB:-wukway_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/postgresql_schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wukway_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
